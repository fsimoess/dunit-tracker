<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMO - Gerenciador D-Unit Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="ph ph-cpu text-3xl text-cyan-400"></i>
        <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
          DMO D-Unit Tracker
        </h1>
      </div>

      <!-- Actions -->
      <div class="flex flex-wrap items-center gap-2 text-sm">
        <button id="btn-secret-export-default" onclick="exportDefaultDataJSON()" class="hidden bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-3 py-1.5 rounded flex items-center gap-1.5 text-xs animate-bounce shadow-lg shadow-amber-500/20 mr-2">
          <i class="ph ph-crown text-base"></i> Exportar default_data.json
        </button>

        <!-- Botões de Reset Separados -->
        <button onclick="resetMasterDefaults()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 px-3 py-1.5 rounded flex items-center gap-1 text-xs transition" title="Reseta apenas Conjuntos, Imagens e Jogress mantendo seu progresso">
          <i class="ph ph-arrows-counter-clockwise"></i> Resetar Base
        </button>

        <button onclick="clearUserProgress()" class="bg-red-900/50 hover:bg-red-800 text-red-200 border border-red-700/50 px-3 py-1.5 rounded flex items-center gap-1 text-xs mr-2 transition" title="Apaga apenas o seu progresso de Digimons cadastrados">
          <i class="ph ph-trash"></i> Limpar Meu Progresso
        </button>

        <button onclick="exportData('sets')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded flex items-center gap-1 text-xs">
          <i class="ph ph-download"></i> Exportar Conjuntos
        </button>
        <button onclick="document.getElementById('import-sets').click()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded flex items-center gap-1 text-xs">
          <i class="ph ph-upload"></i> Importar Conjuntos
        </button>
        <input type="file" id="import-sets" class="hidden" accept=".json" onchange="importData(event, 'sets')">

        <button onclick="exportData('progress')" class="bg-cyan-600 hover:bg-cyan-500 px-3 py-1.5 rounded flex items-center gap-1 text-white font-semibold text-xs ml-2">
          <i class="ph ph-download-simple"></i> Exportar Progresso
        </button>
        <button onclick="document.getElementById('import-progress').click()" class="bg-cyan-600 hover:bg-cyan-500 px-3 py-1.5 rounded flex items-center gap-1 text-white font-semibold text-xs">
          <i class="ph ph-upload-simple"></i> Importar Progresso
        </button>
        <input type="file" id="import-progress" class="hidden" accept=".json" onchange="importData(event, 'progress')">
      </div>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

    <!-- SOMADOR TOTAL DE BUFFS ATIVOS -->
    <section class="bg-gradient-to-r from-slate-800 via-slate-800 to-slate-800/80 p-5 rounded-xl border border-cyan-500/30 shadow-lg">
      <h2 class="text-md font-bold text-cyan-400 mb-3 flex items-center gap-2">
        <i class="ph ph-lightning text-xl text-yellow-400"></i> Somatório Total de Buffs Ativos
      </h2>
      <div id="total-buffs-container" class="flex flex-wrap gap-2 text-xs"></div>
    </section>

    <!-- PRÓXIMOS DIGIMONS PARA FOCAR -->
    <section class="bg-slate-800 rounded-xl border border-yellow-500/30 overflow-hidden shadow-md">
      <button onclick="toggleSection('focus-content', 'focus-icon')" class="w-full p-4 text-left font-bold text-slate-200 flex justify-between items-center hover:bg-slate-700/50 transition">
        <span class="flex items-center gap-2">
          <i class="ph ph-target text-yellow-400 text-xl"></i> 
          Próximos Digimons para Focar <span class="text-xs text-slate-400 font-normal">(Top 5 por presença em conjuntos)</span>
        </span>
        <i id="focus-icon" class="ph ph-caret-down text-lg text-slate-400 transition-transform"></i>
      </button>

      <div id="focus-content" class="hidden p-4 border-t border-slate-700 bg-slate-900/60">
        <div id="focus-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3"></div>
      </div>
    </section>

    <!-- MINHA COLEÇÃO DE DIGIMONS -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
      <button onclick="toggleSection('collection-content', 'collection-icon')" class="w-full p-4 text-left font-bold text-slate-200 flex justify-between items-center hover:bg-slate-700/50 transition">
        <span class="flex items-center gap-2">
          <i class="ph ph-list-bullets text-cyan-400 text-lg"></i> 
          Minha Coleção de Digimons (<span id="digi-count" class="text-cyan-400">0</span>)
        </span>
        <i id="collection-icon" class="ph ph-caret-down text-lg text-slate-400 transition-transform"></i>
      </button>

      <div id="collection-content" class="hidden p-4 border-t border-slate-700 bg-slate-900/50 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3"></div>
    </section>

    <!-- VÍNCULOS DE JOGRESS -->
    <section class="bg-slate-800 rounded-xl border border-purple-500/30 overflow-hidden">
      <button onclick="toggleSection('jogress-content', 'jogress-icon')" class="w-full p-4 text-left font-bold text-slate-200 flex justify-between items-center hover:bg-slate-700/50 transition">
        <span class="flex items-center gap-2">
          <i class="ph ph-infinity text-purple-400 text-xl"></i> 
          Vínculos de Jogress (<span id="jogress-count" class="text-purple-400">0</span>)
        </span>
        <i id="jogress-icon" class="ph ph-caret-down text-lg text-slate-400 transition-transform"></i>
      </button>

      <div id="jogress-content" class="hidden p-4 border-t border-slate-700 bg-slate-900/60 space-y-4">
        <!-- Form Jogress -->
        <form id="form-jogress" onsubmit="saveJogress(event)" class="bg-slate-800 p-3 rounded-lg border border-purple-500/20 flex flex-wrap gap-3 items-end text-xs">
          <div class="flex-1 min-w-[150px]">
            <label class="block text-[11px] uppercase text-purple-300 font-bold mb-1">Nome da Jogress</label>
            <input type="text" id="jogress-name" required placeholder="Ex: Omegamon" class="w-full bg-slate-900 border border-slate-700 rounded p-2 focus:border-purple-500 outline-none">
          </div>
          <div class="flex-[2] min-w-[200px]">
            <label class="block text-[11px] uppercase text-purple-300 font-bold mb-1">Bases da Fusão (separadas por vírgula)</label>
            <input type="text" id="jogress-bases" required placeholder="Ex: Agumon, Gabumon" class="w-full bg-slate-900 border border-slate-700 rounded p-2 focus:border-purple-500 outline-none">
          </div>
          <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-4 py-2 rounded transition">
            Cadastrar Jogress
          </button>
        </form>

        <div id="jogress-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
      </div>
    </section>

    <!-- FORMULÁRIOS E GERENCIAMENTO -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

      <!-- Painel Lateral -->
      <section class="lg:col-span-1 space-y-6">
        
        <!-- Cadastrar Progresso -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
          <div class="flex items-center justify-between mb-4">
            <h2 id="digi-form-title" class="text-lg font-bold text-cyan-400 flex items-center gap-2">
              <i class="ph ph-user-focus"></i> Cadastrar / Atualizar Progresso
            </h2>
            <img id="digi-edit-preview" src="" class="hidden w-10 h-10 object-cover rounded border border-cyan-500/50 bg-slate-900 shadow">
          </div>

          <form id="form-digimon-user" class="space-y-4" onsubmit="saveUserDigimon(event)">
            <div>
              <label class="block text-xs uppercase text-slate-400 mb-1">Espécie Base</label>
              <input type="text" id="user-digi-base" required placeholder="Ex: Agumon" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-cyan-500 outline-none" oninput="updateDigiPreview()">
            </div>
            <div>
              <label class="block text-xs uppercase text-slate-400 mb-1">Evoluções Desbloqueadas (Vírgula)</label>
              <input type="text" id="user-digi-evos" placeholder="Ex: Greymon, Omegamon" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-cyan-500 outline-none">
            </div>
            <div>
              <label class="block text-xs uppercase text-slate-400 mb-1">Nível Atual</label>
              <input type="number" id="user-digi-level" min="1" max="170" value="1" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-cyan-500 outline-none">
            </div>
            <div class="pt-1">
              <label class="flex items-center gap-2 text-sm cursor-pointer">
                <input type="checkbox" id="user-digi-transcend" class="rounded accent-cyan-500">
                <span>Transcendido (6★)</span>
              </label>
            </div>
            
            <div class="flex gap-2">
              <button type="submit" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2 rounded transition">
                Salvar na Coleção
              </button>
              <button type="button" id="btn-cancel-digi-edit" onclick="cancelDigiEdit()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded transition">
                Cancelar
              </button>
            </div>
          </form>
        </div>

        <!-- Cadastrar Conjuntos -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
          <h2 id="set-form-title" class="text-lg font-bold text-cyan-400 mb-4 flex items-center gap-2">
            <i class="ph ph-folder-plus"></i> Cadastrar Novo Conjunto
          </h2>
          <form id="form-set" class="space-y-4" onsubmit="saveSet(event)">
            <input type="hidden" id="editing-set-id" value="">

            <div>
              <label class="block text-xs uppercase text-slate-400 mb-1">Nome do Conjunto</label>
              <input type="text" id="set-name" required placeholder="Ex: Royal Knights" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-cyan-500 outline-none">
            </div>
            <div>
              <label class="block text-xs uppercase text-slate-400 mb-1">Requisitos (Nome_Evolução (Nome_Base))</label>
              <input type="text" id="set-digimons" required placeholder="Ex: Omegamon (Agumon), Omegamon" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-cyan-500 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] uppercase text-slate-400 mb-1">Soma Lv. Alvo (Nv 2)</label>
                <input type="number" id="target-lvl-2" value="600" min="1" max="5000" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs focus:border-cyan-500 outline-none">
              </div>
              <div>
                <label class="block text-[11px] uppercase text-slate-400 mb-1">Soma Lv. Alvo (Nv 4)</label>
                <input type="number" id="target-lvl-4" value="800" min="1" max="5000" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs focus:border-cyan-500 outline-none">
              </div>
            </div>

            <hr class="border-slate-700">
            <p class="text-xs font-bold uppercase text-slate-400">Atributos / Buffs do Conjunto</p>

            <div class="space-y-2">
              <input type="text" id="buff-1" placeholder="Buff Nível 1 (Evoluções)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs focus:border-cyan-500 outline-none">
              <input type="text" id="buff-2" placeholder="Buff Nível 2 (Soma Nível)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs focus:border-cyan-500 outline-none">
              <input type="text" id="buff-3" placeholder="Buff Nível 3 (Transcendências)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs focus:border-cyan-500 outline-none">
              <input type="text" id="buff-4" placeholder="Buff Nível 4 (Soma Nível)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs focus:border-cyan-500 outline-none">
            </div>

            <div class="flex gap-2">
              <button type="submit" id="btn-save-set" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 rounded transition">
                Cadastrar Conjunto
              </button>
              <button type="button" id="btn-cancel-set-edit" onclick="cancelSetEdit()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded transition">
                Cancelar
              </button>
            </div>
          </form>
        </div>

      </section>

      <!-- Visualizador de Conjuntos -->
      <section class="lg:col-span-2 space-y-6">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
            <i class="ph ph-squares-four text-cyan-400"></i> Conjuntos Cadastrados
          </h2>
          <div class="flex gap-2 text-xs">
            <button onclick="toggleAllSets(true)" class="text-slate-400 hover:text-cyan-400 underline">Expandir Todos</button>
            <span class="text-slate-600">•</span>
            <button onclick="toggleAllSets(false)" class="text-slate-400 hover:text-cyan-400 underline">Recolher Todos</button>
          </div>
        </div>

        <div id="sets-container" class="space-y-4"></div>
      </section>

    </div>

    <!-- BANCO DE IMAGENS -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden mt-8">
      <button onclick="toggleSection('images-content', 'images-icon')" class="w-full p-4 text-left font-bold text-slate-200 flex justify-between items-center hover:bg-slate-700/50 transition">
        <span class="flex items-center gap-2">
          <i class="ph ph-image text-cyan-400 text-xl"></i> 
          Banco de Imagens / Ícones de Digimons (<span id="img-db-count" class="text-cyan-400">0</span>)
        </span>
        <i id="images-icon" class="ph ph-caret-down text-lg text-slate-400 transition-transform"></i>
      </button>

      <div id="images-content" class="hidden p-6 border-t border-slate-700 bg-slate-900/60 space-y-6">
        <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 max-w-2xl">
          <h3 id="img-form-title" class="text-sm font-bold text-cyan-400 mb-3 flex items-center gap-1.5">
            <i class="ph ph-plus-circle"></i> Cadastrar Ícone por Digimon
          </h3>
          <form id="form-img" onsubmit="saveImageEntry(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] uppercase text-slate-400 mb-1">Nome Exato</label>
              <input type="text" id="img-digi-name" required placeholder="Ex: Omegamon" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs focus:border-cyan-500 outline-none">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-[11px] uppercase text-slate-400 mb-1">URL da Imagem</label>
              <div class="flex gap-2">
                <input type="url" id="img-digi-url" placeholder="https://... (vazio = Padrão)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs focus:border-cyan-500 outline-none">
                <button type="submit" id="btn-save-img" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-4 py-2 rounded text-xs transition">Salvar</button>
                <button type="button" id="btn-cancel-img" onclick="cancelImageEdit()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded text-xs transition">Cancelar</button>
              </div>
            </div>
          </form>
        </div>

        <div>
          <h4 class="text-xs uppercase font-bold text-slate-400 mb-3">Ícones Cadastrados</h4>
          <div id="images-db-container" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>
        </div>
      </div>
    </section>

  </main>

  <script>
    function getDefaultGrindosaurUrl(name) {
      if (!name) return 'https://via.placeholder.com/80/1e293b/475569?text=?';
      const cleanName = name.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');
      return `https://www.grindosaur.com/img/games/digimon-story-time-stranger/icons/${cleanName}-icon.png`;
    }

    let imagesDB = {};
    let setsDB = [];
    let userProgress = {};
    let jogressDB = {};
    let collapsedSets = {};
    let editingImageName = null;

    async function initAppData() {
      const storedImages = localStorage.getItem('dmo_dunit_images') || sessionStorage.getItem('dmo_dunit_images');
      const storedSets = localStorage.getItem('dmo_dunit_sets') || sessionStorage.getItem('dmo_dunit_sets');
      const storedProgress = localStorage.getItem('dmo_dunit_progress');
      const storedJogress = localStorage.getItem('dmo_dunit_jogress') || sessionStorage.getItem('dmo_dunit_jogress');

      if (storedImages && storedSets) {
        imagesDB = JSON.parse(storedImages);
        setsDB = JSON.parse(storedSets);
        if (storedProgress) userProgress = JSON.parse(storedProgress);
        if (storedJogress) jogressDB = JSON.parse(storedJogress);
        syncSetImagesToDB();
        render();
      } else {
        await fetchDefaultJSON();
      }
    }

    async function fetchDefaultJSON() {
      try {
        const response = await fetch('./default_data.json');
        if (!response.ok) throw new Error();
        const data = await response.json();
        imagesDB = data.imagesDB || {};
        setsDB = data.setsDB || [];
        jogressDB = data.jogressDB || {};
        syncSetImagesToDB();
        saveStorage();
      } catch (err) {
        console.warn("Aviso: default_data.json não encontrado localmente.");
        syncSetImagesToDB();
        saveStorage();
      }
    }

    function resetMasterDefaults() {
      if (confirm('Deseja restaurar os Conjuntos, Ícones e Jogress padrão? Seu progresso de Digimons NÃO será apagado.')) {
        localStorage.removeItem('dmo_dunit_images');
        localStorage.removeItem('dmo_dunit_sets');
        localStorage.removeItem('dmo_dunit_jogress');
        sessionStorage.clear();
        fetchDefaultJSON();
      }
    }

    function clearUserProgress() {
      if (confirm('Tem certeza que deseja LIMPAR TODOS OS DIGIMONS do seu progresso? Essa ação não pode ser desfeita.')) {
        userProgress = {};
        saveStorage();
      }
    }

    function saveStorage() {
      localStorage.setItem('dmo_dunit_images', JSON.stringify(imagesDB));
      localStorage.setItem('dmo_dunit_sets', JSON.stringify(setsDB));
      localStorage.setItem('dmo_dunit_progress', JSON.stringify(userProgress));
      localStorage.setItem('dmo_dunit_jogress', JSON.stringify(jogressDB));
      
      sessionStorage.setItem('dmo_dunit_images', JSON.stringify(imagesDB));
      sessionStorage.setItem('dmo_dunit_sets', JSON.stringify(setsDB));
      sessionStorage.setItem('dmo_dunit_jogress', JSON.stringify(jogressDB));

      render();
    }

    function syncSetImagesToDB() {
      setsDB.forEach(set => {
        set.requirements.forEach(req => {
          [req.evo, req.base].forEach(digiName => {
            if (digiName) {
              const foundKey = Object.keys(imagesDB).find(k => k.toLowerCase() === digiName.toLowerCase());
              if (!foundKey) imagesDB[digiName] = getDefaultGrindosaurUrl(digiName);
            }
          });
        });
      });
    }

    function checkSecretTrigger(name) {
      if (name && name.trim().toLowerCase() === 'mugiwaraya') {
        const btnSecret = document.getElementById('btn-secret-export-default');
        if (btnSecret) btnSecret.classList.remove('hidden');
      }
    }

    function exportDefaultDataJSON() {
      const defaultDataClean = {
        imagesDB: imagesDB || {},
        setsDB: setsDB || [],
        jogressDB: jogressDB || {}
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(defaultDataClean, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "default_data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function toggleSection(contentId, iconId) {
      document.getElementById(contentId).classList.toggle('hidden');
      document.getElementById(iconId).classList.toggle('rotate-180');
    }

    function toggleSetCollapse(setId) {
      collapsedSets[setId] = !collapsedSets[setId];
      render();
    }

    function toggleAllSets(expand) {
      setsDB.forEach(s => collapsedSets[s.id] = !expand);
      render();
    }

    function getDigiImg(name) {
      if (!name) return 'https://via.placeholder.com/80/1e293b/475569?text=?';
      const foundKey = Object.keys(imagesDB).find(k => k.toLowerCase() === name.toLowerCase());
      if (foundKey) return imagesDB[foundKey];
      const newUrl = getDefaultGrindosaurUrl(name);
      imagesDB[name] = newUrl;
      return newUrl;
    }

    function updateDigiPreview() {
      const name = document.getElementById('user-digi-base').value.trim();
      const previewImg = document.getElementById('digi-edit-preview');
      if (name) {
        previewImg.src = getDigiImg(name);
        previewImg.classList.remove('hidden');
      } else {
        previewImg.classList.add('hidden');
      }
      checkSecretTrigger(name);
    }

    function getResolvedDigiData(reqEvo, reqBase) {
      if (reqBase && reqBase !== reqEvo) {
        const digi = userProgress[reqBase];
        if (!digi) return null;
        const hasEvo = digi.unlockedEvos.some(e => e.toLowerCase() === reqEvo.toLowerCase());
        return { level: digi.level, transcended: digi.transcended, hasEvo, base: reqBase };
      }

      const jogressKey = Object.keys(jogressDB).find(k => k.toLowerCase() === reqEvo.toLowerCase());

      if (jogressKey && jogressDB[jogressKey].length > 0) {
        const bases = jogressDB[jogressKey];
        let maxLvl = 0;
        let isTranscended = false;
        let anyEvoUnlocked = false;

        bases.forEach(b => {
          const d = userProgress[b];
          if (d) {
            if (d.level > maxLvl) maxLvl = d.level;
            if (d.transcended) isTranscended = true;
            if (d.unlockedEvos.some(e => e.toLowerCase() === reqEvo.toLowerCase())) anyEvoUnlocked = true;
          }
        });

        if (maxLvl === 0 && !anyEvoUnlocked) return null;
        return { level: maxLvl, transcended: isTranscended, hasEvo: anyEvoUnlocked, base: bases[0] };
      }

      const digi = userProgress[reqEvo];
      if (!digi) return null;
      const hasEvo = digi.unlockedEvos.some(e => e.toLowerCase() === reqEvo.toLowerCase());
      return { level: digi.level, transcended: digi.transcended, hasEvo, base: reqEvo };
    }

    // CHECK BUFFS STATUS (COM SOMA DE NÍVEL DIRETA / COMPLETA)
    function checkBuffsStatus(set) {
      let b1 = true;
      let b3 = true;
      
      const uniqueBasesMap = {};
      let evosUnlockedCount = 0;
      let missingEvos = [];
      let totalLevelSum = 0;

      for (let req of set.requirements) {
        const digi = getResolvedDigiData(req.evo, req.base);
        
        if (!digi || !digi.hasEvo) {
          b1 = false;
          missingEvos.push(req.evo);
        } else {
          evosUnlockedCount++;
        }

        if (!digi || !digi.transcended) {
          b3 = false;
        }

        // Soma direta por cada slot desbloqueado/cadastrado
        if (digi && digi.level) {
          totalLevelSum += digi.level;
        }

        // Mapeamento mantido individual por base única apenas para a checagem da Transcendência (6★)
        const baseKey = req.base || req.evo;
        if (digi) {
          if (!uniqueBasesMap[baseKey] || digi.level > uniqueBasesMap[baseKey].level) {
            uniqueBasesMap[baseKey] = {
              level: digi.level,
              transcended: digi.transcended
            };
          }
        } else {
          if (!uniqueBasesMap[baseKey]) {
            uniqueBasesMap[baseKey] = { level: 0, transcended: false };
          }
        }
      }

      let totalTranscendCount = 0;
      const baseKeys = Object.keys(uniqueBasesMap);

      baseKeys.forEach(k => {
        if (uniqueBasesMap[k].transcended) totalTranscendCount++;
      });

      const reqLvl2 = set.reqLvl2 || 600;
      const reqLvl4 = set.reqLvl4 || 800;

      const b2 = totalLevelSum >= reqLvl2;
      const b4 = totalLevelSum >= reqLvl4;

      const totalReqsCount = set.requirements.length;
      const isFullCompleted = b1 && b2 && b3 && b4;

      return {
        b1, b2, b3, b4,
        totalLevelSum,
        totalTranscendCount,
        uniqueBasesCount: baseKeys.length,
        evosUnlockedCount,
        totalReqsCount,
        missingEvos,
        isFullCompleted
      };
    }

    function calculateFocusDigimons() {
      const counts = {};
      setsDB.forEach(set => {
        const status = checkBuffsStatus(set);
        if (!status.isFullCompleted) {
          const setBasesNeedingFocus = new Set();
          set.requirements.forEach(req => {
            const base = req.base;
            const digi = getResolvedDigiData(req.evo, req.base);
            const isMaxed = digi && digi.transcended && digi.hasEvo;
            if (!isMaxed && base) {
              setBasesNeedingFocus.add(base);
            }
          });
          setBasesNeedingFocus.forEach(base => {
            counts[base] = (counts[base] || 0) + 1;
          });
        }
      });

      return Object.keys(counts)
        .map(base => ({ base, count: counts[base] }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 5);
    }

    function calculateTotalBuffs() {
      const totals = {};
      setsDB.forEach(set => {
        const status = checkBuffsStatus(set);
        const activeBuffTexts = [];

        if (status.b1 && set.buffs.b1) activeBuffTexts.push(set.buffs.b1);
        if (status.b2 && set.buffs.b2) activeBuffTexts.push(set.buffs.b2);
        if (status.b3 && set.buffs.b3) activeBuffTexts.push(set.buffs.b3);
        if (status.b4 && set.buffs.b4) activeBuffTexts.push(set.buffs.b4);

        activeBuffTexts.forEach(txt => {
          const match = txt.match(/^(.+?)\s*([\+\-])\s*(\d+(?:\.\d+)?)\s*(%?)$/);
          if (match) {
            const attr = match[1].trim();
            const sign = match[2];
            const val = parseFloat(match[3]) * (sign === '-' ? -1 : 1);
            const isPercent = match[4] === '%';
            const key = attr + (isPercent ? ' (%)' : '');
            totals[key] = (totals[key] || 0) + val;
          } else {
            totals[txt] = (totals[txt] || 0) + 1;
          }
        });
      });

      return totals;
    }

    function parseRequirementString(str) {
      return str.split(',').map(item => {
        item = item.trim();
        const match = item.match(/^(.+?)\s*\((.+?)\)$/);
        if (match) return { evo: match[1].trim(), base: match[2].trim() };
        return { evo: item, base: item };
      }).filter(i => i.evo.length > 0);
    }

                    </div>
                    <i class="ph ${status.b2 ? 'ph-check-circle text-emerald-400 text-lg' : 'ph-x-circle text-slate-600 text-lg'}"></i>
                  </div>

                  <div class="p-2.5 rounded flex justify-between items-center ${status.b3 ? 'bg-emerald-950/60 border border-emerald-500/40 text-emerald-200' : 'bg-slate-900 text-slate-500'}">
                    <div>
                      <span class="font-bold text-[10px] uppercase block ${status.b3 ? 'text-emerald-400' : 'text-slate-600'}">Nível 3 (Transcend 6★)</span>
                      <span>${set.buffs.b3}</span>
                    </div>
                    <i class="ph ${status.b3 ? 'ph-check-circle text-emerald-400 text-lg' : 'ph-x-circle text-slate-600 text-lg'}"></i>
                  </div>

                  <div class="p-2.5 rounded flex justify-between items-center ${status.b4 ? 'bg-emerald-950/60 border border-emerald-500/40 text-emerald-200' : 'bg-slate-900 text-slate-500'}">
                    <div>
                      <span class="font-bold text-[10px] uppercase block ${status.b4 ? 'text-emerald-400' : 'text-slate-600'}">Nível 4 (Soma Nível ${set.reqLvl4 || 800}+)</span>
                      <span>${set.buffs.b4}</span>
                    </div>
                    <i class="ph ${status.b4 ? 'ph-check-circle text-emerald-400 text-lg' : 'ph-x-circle text-slate-600 text-lg'}"></i>
                  </div>

                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      // 6. Banco de Imagens
      const imgDbContainer = document.getElementById('images-db-container');
      const imgKeys = Object.keys(imagesDB);
      document.getElementById('img-db-count').innerText = imgKeys.length;

      if (imgKeys.length === 0) {
        imgDbContainer.innerHTML = `<p class="col-span-full text-slate-500 text-xs py-2">Nenhum ícone no banco.</p>`;
      } else {
        imgDbContainer.innerHTML = imgKeys.map(name => `
          <div class="bg-slate-800 p-2 rounded border border-slate-700 flex items-center justify-between gap-2 overflow-hidden">
            <div class="flex items-center gap-2 overflow-hidden">
              <img src="${imagesDB[name]}" class="w-8 h-8 object-cover rounded bg-slate-900">
              <span class="text-xs font-semibold text-slate-200 truncate">${name}</span>
            </div>
            <div class="flex items-center">
              <button onclick="editImageEntry('${name}')" class="text-slate-400 hover:text-yellow-400 p-1"><i class="ph ph-pencil-simple"></i></button>
              <button onclick="deleteImageEntry('${name}')" class="text-slate-400 hover:text-red-400 p-1"><i class="ph ph-trash"></i></button>
            </div>
          </div>
        `).join('');
      }
    }

    function exportData(type) {
      const data = type === 'sets' ? setsDB : { userProgress, imagesDB, jogressDB };
      const filename = type === 'sets' ? 'dunit_conjuntos.json' : 'dunit_progresso.json';
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
    }

    function importData(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (type === 'sets') {
            setsDB = parsed;
            syncSetImagesToDB();
          } else {
            if (parsed.userProgress) {
              userProgress = parsed.userProgress;
              imagesDB = parsed.imagesDB || imagesDB;
              jogressDB = parsed.jogressDB || jogressDB;
            } else {
              userProgress = parsed;
            }
          }
          saveStorage();
          alert('Dados importados com sucesso!');
        } catch (err) {
          alert('Erro ao carregar o arquivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    initAppData();
  </script>
</body>
</html>
